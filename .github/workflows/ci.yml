# Runs the check command (tools/check.ts), the same one run by hand, so CI and
# a local check can't disagree. The published Claude Code
# package carries `plugin validate` and `plugin test`, and both run on a
# runner without signing in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the mod
        run: node tools/check.ts
